
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的個人網站</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fce4ec, #e3f2fd);
      color: #444;
      text-align: center;
    }
    .card {
      max-width: 500px;
      margin: 100px auto;
      padding: 40px 20px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 30px #00000012;
    }
    h1 { color: #d16b91; }
    p { line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 24px;
      background: #d16b91;
      color: white;
      text-decoration: none;
      border-radius: 25px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>嗨！我是你的名字 ♡</h1>
    <p>歡迎來到我的個人網站！</p>
    <p>這裡記錄我的生活、興趣與作品。</p>
    <a href="https://github.com/">我的 GitHub</a>
  </div>
</body>
</html>
